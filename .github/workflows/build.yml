name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create a GitHub Release for this build"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so tag/version-code derivation is stable

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Gradle CLI available
        run: gradle --version

      - name: Generate Gradle wrapper (if missing)
        run: |
          if [ ! -f ./gradlew ] || [ ! -f ./gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Derive build identifiers
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          RUN_NUM="${{ github.run_number }}"
          DATE_STAMP=$(date -u +%Y%m%d)
          TAG="v0.0.${RUN_NUM}-${DATE_STAMP}-${SHORT_SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "release_name=IP Rerouter ${TAG}" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore (if configured)
        id: signing
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          echo "has_signing=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK (signed)
        if: steps.signing.outputs.has_signing == 'true'
        run: |
          ./gradlew assembleRelease \
            -PRELEASE_STORE_FILE="${{ github.workspace }}/release.keystore" \
            -PRELEASE_STORE_PASSWORD="${{ secrets.RELEASE_STORE_PASSWORD }}" \
            -PRELEASE_KEY_ALIAS="${{ secrets.RELEASE_KEY_ALIAS }}" \
            -PRELEASE_KEY_PASSWORD="${{ secrets.RELEASE_KEY_PASSWORD }}" \
            --no-daemon

      - name: Build release APK (unsigned)
        if: steps.signing.outputs.has_signing != 'true'
        run: ./gradlew assembleRelease --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Locate APKs
        id: apks
        run: |
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
          echo "release_apk=${RELEASE_APK}" >> "$GITHUB_OUTPUT"
          echo "debug_apk=${DEBUG_APK}" >> "$GITHUB_OUTPUT"

      - name: Rename APKs for clarity
        run: |
          mkdir -p out
          cp "${{ steps.apks.outputs.release_apk }}" "out/ip-rerouter-${{ steps.vars.outputs.tag }}-release.apk"
          cp "${{ steps.apks.outputs.debug_apk }}" "out/ip-rerouter-${{ steps.vars.outputs.tag }}-debug.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ip-rerouter-${{ steps.vars.outputs.tag }}
          path: out/*.apk
          retention-days: 30

      # Only runs on an explicit manual trigger with publish_release checked,
      # or automatically on pushes to main/master. PRs never publish a release.
      - name: Create tag and GitHub Release
        if: >
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.release_name }}
          generate_release_notes: true
          files: out/*.apk
          prerelease: ${{ steps.signing.outputs.has_signing != 'true' }}
